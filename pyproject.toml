[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nami"
version = "3.0.3"
description = "An open-source CLI media downloader for Instagram, TikTok, Facebook, and X"
readme = "README.md"
authors = [
    { name = "Igect" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "gallery-dl>=1.32.9",
    "yt-dlp>=2026.7.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/OpenSelena/nami"
Repository = "https://github.com/OpenSelena/nami.git"
"Bug Tracker" = "https://github.com/OpenSelena/nami/issues"

[project.scripts]
nami = "nami.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
