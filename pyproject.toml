[build-system]
requires = ["setuptools>=61.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "nami"
version = "5.0.1"
description = "An open-source CLI media downloader for Instagram, TikTok, Facebook, and X"
readme = "README.md"
authors = [
    { name = "Igect" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "gallery-dl>=1.32.9",
    "yt-dlp>=2026.7.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/OpenSelena/nami"
Repository = "https://github.com/OpenSelena/nami.git"
"Bug Tracker" = "https://github.com/OpenSelena/nami/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.8.0",
    "build>=1.0.0",
    "twine>=5.0",
    "check-wheel-contents>=0.6.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
nami = "nami.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nami = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "PIE", "RUF", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

