[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nami"
version = "2.3.7"
description = "Multi-platform media downloader (Instagram, TikTok, Facebook, X) powered by gallery-dl and yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Igect" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rich",
    "gallery-dl",
    "yt-dlp",
]

[project.urls]
Homepage = "https://github.com/OpenSelena/nami"
Issues = "https://github.com/OpenSelena/nami/issues"

[project.scripts]
nami = "nami.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
