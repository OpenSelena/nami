name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade '.[dev]'

      - name: Run Ruff lint
        run: python -m ruff check src tests

      - name: Run Ruff format check
        run: python -m ruff format --check src tests

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check package version import
        run: |
          python - <<'PY'
          import importlib.metadata
          import nami

          package_version = importlib.metadata.version("nami")
          assert nami.__version__ == package_version, (nami.__version__, package_version)
          print(f"nami {package_version}")
          PY

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Check installed dependencies
        run: python -m pip check

  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine check-wheel-contents

      - name: Build distribution packages
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Verify wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Smoke install wheel
        run: |
          python -m venv .audit-dist
          . .audit-dist/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          python - <<'PY'
          import importlib.metadata
          import nami

          assert nami.__version__ == importlib.metadata.version("nami")
          print(nami.__version__)
          PY
